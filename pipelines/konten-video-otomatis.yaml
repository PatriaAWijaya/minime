# Pipeline konten video otomatis — adaptasi diagram n8n 3-step Patria (17 Okt 2026).
#
# STEP 1 (diagram): trigger harian → AI Agent generate konsep → simpan ke Sheets
#   → AI Agent format prompt Veo3. Di Minime: stage `skrip` (LLM via routing
#   provider Minime: Muse/Gemini/DeepSeek/OpenCode-free — BUKAN GPT-4.1).
# STEP 2 (diagram): call Veo3 API (fal.ai queue) → tunggu ±5 mnt → ambil URL
#   → log. Di Minime (17 Okt, perintah Patria): stage `render` (tool veo3)
#   dengan rantai backend GEMINI API PRIMER → fal.ai → HyperFrames lokal.
#   Model default: veo-3.1-fast-generate-preview (1080p/8 dtk/16:9).
#   Tanpa key Gemini → coba fal.ai → tanpa keduanya → HyperFrames lokal;
#   tiap langkah dicatat jujur di "attempts".
# STEP 3 (diagram): ambil video → upload Blotato → assign IDs → publish 9
#   platform → log Sheets. Di Minime (17 Okt, perintah Patria): distribusi
#   HYBRID — 3 platform Meta (IG/FB/Threads) via tool `meta` (koneksi langsung
#   Graph API/Threads API, DRAFT-ONLY), 6 platform non-Meta via tool `blotato`
#   (op draft — tidak pernah publish otomatis).
#
# ATURAN KERAS (rule #3): TIDAK ADA auto-posting. Seluruh 9 platform hanya
# berupa DRAFT; publish IG/FB/Threads DITOLAK di kode (manual oleh Patria);
# 6 platform lain hanya via op blotato.publish dengan approval_id yang sudah
# di-approve. Gate approval Patria (stage distribusi → approval) menghentikan
# run; logging utama di SQLite Minime (Sheets opsional).
#
# Konvensi antar-stage (karena tool stage tidak bisa baca output LLM langsung):
#   - stage skrip WAJIB menulis baris "PROMPT_VEO3: <prompt detail>" dan
#     "CAPTION: <caption + hashtag>" di outputnya.
#   - stage render/distribusi memakai params eksplisit bila diisi, else baca
#     output stage skrip / artefak MP4 stage render dari runs.context.
name: konten-video-otomatis
version: 2
description: Video AI harian — skrip → render Veo 3.1 (Gemini API primer → fal.ai → HyperFrames) → QC → draft distribusi hybrid (Meta langsung + Blotato non-Meta) → approval Patria (DRAFT-ONLY)

stages:
  - id: skrip
    agent: creative-director
    title: Konsep video + prompt Veo3
    skills: [storytelling, copywriting, content]
    notes: >-
      Buat 1 konsep video harian (±8 detik, 16:9): hook 0–3 detik, deskripsi
      visual detail per detik, gaya visual, teks on-screen bila perlu.
      Tulis di output: baris "PROMPT_VEO3: <prompt Inggris detail, gaya, rasio
      16:9, durasi 8 detik>" dan baris "CAPTION: <caption Indonesia + hashtag
      untuk 9 platform>". Caption ringkas, sesuai quality bar storytelling.
    on_done: handoff(creative-director)

  - id: render
    agent: creative-director
    title: Render video (Veo 3.1 Gemini API / fallback berantai)
    skills: [content]
    tool:
      id: veo3
      op: render
      params:
        prompt: ""
        duration_s: 8
        aspect_ratio: "16:9"
        resolution: "1080p"
        backend: "auto"
        output: "video-harian.mp4"
    notes: >-
      params.prompt kosong = ambil dari baris PROMPT_VEO3: stage skrip.
      backend "auto" (default): Gemini API (Veo 3.1 Fast) → fal.ai →
      HyperFrames lokal; tiap percobaan dicatat di "attempts" (jujur).
      backend bisa dipaksa: "gemini"|"fal"|"local". Perkiraan biaya klip
      8 dtk 1080p Fast ≈ $0,96 (harga publik Google, bukan janji).
    on_done: handoff(qc)

  - id: qc
    agent: qc
    title: Quality control
    skills: [qc-rubrik]
    notes: >-
      Nilai konsep + prompt + video (bila artefak MP4 ada di
      runs.context.stages.render.artifacts): relevansi pesan, kejelasan visual,
      kepatuhan brand & rule #3. Format: "SKOR: <0-100>" + alasan.
    on_done: handoff(creative-director)

  - id: distribusi-meta
    agent: creative-director
    title: Draft distribusi Meta langsung (DRAFT-ONLY)
    skills: [smo-playbook]
    tool:
      id: meta
      op: draft
      params:
        video_path: ""
        caption: ""
        hashtags: []
        platforms:
          - instagram
          - facebook
          - threads
    notes: >-
      ATURAN KERAS — HANYA DRAFT. Koneksi langsung Meta (Graph API + Threads
      API); op publish DITOLAK di kode tool. video_path/caption kosong = ambil
      artefak MP4 stage render + baris CAPTION: stage skrip. IG/FB/Threads
      selalu manual oleh Patria.
    on_done: handoff(creative-director)

  - id: distribusi-nometa
    agent: creative-director
    title: Draft distribusi non-Meta via Blotato (DRAFT-ONLY)
    skills: [smo-playbook]
    tool:
      id: blotato
      op: draft
      params:
        video_path: ""
        caption: ""
        hashtags: []
        platforms:
          - youtube
          - tiktok
          - twitter
          - linkedin
          - bluesky
          - pinterest
    notes: >-
      ATURAN KERAS — HANYA DRAFT. 6 platform non-Meta via Blotato; op publish
      hanya dengan approval_id yang sudah di-approve Patria (Meta tidak
      dilayani tool ini lagi).
    on_done: approval
