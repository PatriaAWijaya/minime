# docker-compose untuk postiz-app di Mac (Apple Silicon)
#
# Diadaptasi dari docker-compose.yaml resmi postiz-app v1.47.0
# (https://github.com/gitroomhq/postiz-app, AGPL-3.0).
# Perubahan dari versi resmi:
#   - env dipindah ke file .env (lihat .env.example)
#   - spotlight, temporal-ui, temporal-admin-tools dipindah ke profile
#     "opsional" (tidak ikut start; hanya untuk debugging)
# Semua image sudah terverifikasi mendukung linux/arm64 (Apple Silicon).
#
# Cara pakai:
#   1. cp .env.example .env  (lalu isi sesuai panduan INSTALL_MAC.md)
#   2. docker compose up -d
#   3. Buka http://localhost:4007

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest # arm64 OK (terverifikasi)
    container_name: postiz
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MAIN_URL: 'http://localhost:4007'
      FRONTEND_URL: 'http://localhost:4007'
      NEXT_PUBLIC_BACKEND_URL: 'http://localhost:4007/api'
      DATABASE_URL: 'postgresql://postiz-user:postiz-password@postiz-postgres:5432/postiz-db-local'
      REDIS_URL: 'redis://postiz-redis:6379'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      TEMPORAL_ADDRESS: 'temporal:7233'
      IS_GENERAL: 'true'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      NX_ADD_PLUGINS: 'false'
      API_LIMIT: 30
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '4007:5000'
    networks:
      - postiz-network
      - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy

  # WAJIB — database utama postiz
  postiz-postgres:
    image: postgres:17-alpine # arm64 OK (terverifikasi)
    container_name: postiz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiz-password}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3

  # WAJIB — antrian/cache postiz
  postiz-redis:
    image: redis:7.2 # arm64 OK (terverifikasi)
    container_name: postiz-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # WAJIB untuk penjadwalan/publish otomatis — Temporal mengeksekusi
  # post yang sudah di-schedule. Tanpa ini, draft bisa dibuat tapi
  # tidak bisa dijadwalkan terkirim.
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1 # arm64 OK (terverifikasi)
    restart: unless-stopped
    ports:
      - '7233:7233'
    depends_on:
      - temporal-postgresql
      - temporal-elasticsearch
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  # Pendukung Temporal (database internal Temporal)
  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16 # arm64 OK (terverifikasi)
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - /var/lib/postgresql/data

  # Pendukung Temporal (pencarian/visibilitas workflow).
  # Berat (±256MB heap Java). Bila Mac terasa berat, layanan ini BISA
  # dimatikan dengan catatan: set ENABLE_ES=false di service temporal
  # dan hapus depends_on-nya — BELUM TERUJI, lakukan bila perlu saja.
  temporal-elasticsearch:
    container_name: temporal-elasticsearch
    image: elasticsearch:7.17.27 # arm64 OK (terverifikasi)
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  # ---- OPSIONAL (profile "opsional", tidak ikut start default) ----
  # Jalankan manual bila butuh: docker compose --profile opsional up -d

  # Monitoring/debugging Sentry (opsional)
  spotlight:
    profiles: ["opsional"]
    pull_policy: always
    container_name: spotlight
    ports:
      - 8969:8969/tcp
    image: ghcr.io/getsentry/spotlight:latest # arm64 OK (terverifikasi)
    networks:
      - postiz-network

  # UI web Temporal (opsional, untuk melihat workflow terjadwal)
  temporal-ui:
    profiles: ["opsional"]
    container_name: temporal-ui
    image: temporalio/ui:2.34.0 # arm64 OK (terverifikasi)
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://127.0.0.1:3000
    networks:
      - temporal-network
    ports:
      - '8080:8080'

  # CLI admin Temporal (opsional)
  temporal-admin-tools:
    profiles: ["opsional"]
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1 # arm64 OK (terverifikasi)
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    depends_on:
      - temporal
    tty: true

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:

networks:
  postiz-network:
  temporal-network:
    driver: bridge
    name: temporal-network
