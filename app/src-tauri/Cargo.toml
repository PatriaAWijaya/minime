[package]
name = "minime"
version = "0.1.0"
description = "Minime v2 — desktop app for persistent AI teammates (clean-room rebuild)"
authors = ["Minime"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Planned for Phase 2 (agent runtime persistence). Included now so the
# schema work can start against a real dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# Tahap 2 — model router nyata.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
keyring = "3"
# Tahap 3.4 — Pireel OAuth (PKCE S256 + random state).
sha2 = "0.10"
getrandom = "0.2"
tauri-plugin-wdio-webdriver = "1.5.0"
tauri-plugin-notification = "2"

# Dynamic Island haptics on macOS (NSHapticFeedbackManager via FFI).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
