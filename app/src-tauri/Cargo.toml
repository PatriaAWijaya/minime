[package]
name = "minime"
version = "0.1.0"
description = "Minime v2 — desktop app for persistent AI teammates (clean-room rebuild)"
authors = ["Minime"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Planned for Phase 2 (agent runtime persistence). Included now so the
# schema work can start against a real dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
# Tahap 2 — model router nyata.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
keyring = "3"
tauri-plugin-wdio-webdriver = "1.5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
